[project]
name = "energy-resilience-assurance-lab"
version = "0.1.0"
description = "Evidence-led operational resilience assurance tooling for an OpenEMS energy-management reference environment."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
energy-assurance = "energy_assurance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
