name: Assurance Validation

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: energy

jobs:
  assurance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate assurance models
        run: ./scripts/assure validate

      - name: Assess recorded resilience evidence
        run: ./scripts/assure assess

      - name: Verify evidence integrity
        run: ./scripts/assure verify-manifest

      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v
